<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List – Version Bootstrap</title>

  <!-- ✅ Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light text-dark">

  <!-- ✅ Ce bloc est l'équivalent Bootstrap du bouton thème -->
  <div class="d-flex justify-content-end p-3">
    <button id="toggle-theme" class="btn btn-secondary">🌞 / 🌙</button>
  </div>

  <main class="container">

    <!-- ✅ Titre principal -->
    <h1 class="h2 fw-bold mb-4">Ma Todo List</h1>

    <!-- ✅ Message de confirmation -->
    <div class="alert alert-success alert-dismissible fade show" role="alert">
      Tâche ajoutée avec succès.
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- ✅ Formulaire d'ajout -->
    <form class="row g-2 mb-4">
      <div class="col-md-6">
        <input type="text" class="form-control" placeholder="Ajouter une tâche..." required>
      </div>
      <div class="col-md-3">
        <select class="form-select">
          <option value="normale">Normale</option>
          <option value="importante">Importante</option>
          <option value="urgente">Urgente</option>
        </select>
      </div>
      <div class="col-md-3">
        <button type="submit" class="btn btn-success w-100">Ajouter</button>
      </div>
    </form>

    <!-- ✅ Barre de recherche -->
    <input type="text" class="form-control mb-3" placeholder="Rechercher une tâche...">

    <!-- ✅ Boutons de tri + vue -->
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
      <div class="btn-group">
        <button class="btn btn-outline-secondary btn-sm">Trier A → Z</button>
        <button class="btn btn-outline-secondary btn-sm">Trier par priorité</button>
      </div>
      <button class="btn btn-primary btn-sm">Vue Grille</button>
    </div>

    <!-- ✅ Liste des tâches (exemple statique) -->
    <ul class="list-group mb-5">
      <li class="list-group-item d-flex justify-content-between align-items-center border-start border-4 border-success">
        ✅ Normale
        <div>
          <input type="checkbox" class="form-check-input me-3">
          <button class="btn btn-sm btn-outline-danger" title="Supprimer">🗑️</button>
        </div>
      </li>
    </ul>

    <!-- ✅ Bouton suppression groupée -->
    <div class="d-flex justify-content-center mb-5">
      <button class="btn btn-danger">Supprimer toutes les tâches terminées</button>
    </div>
  </main>

  <!-- ✅ JS Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
